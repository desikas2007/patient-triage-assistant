<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0f9f4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eef6ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="accent2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.06" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.04" />
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>
  
  <!-- Base background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  
  <!-- Soft gradient overlays -->
  <rect width="1920" height="1080" fill="url(#accent1)"/>
  
  <!-- Abstract medical elements - soft circles suggesting clinical environment -->
  <circle cx="300" cy="200" r="180" fill="#0ea5e9" opacity="0.04" filter="url(#blur2)"/>
  <circle cx="1600" cy="300" r="250" fill="#22c55e" opacity="0.03" filter="url(#blur2)"/>
  <circle cx="960" cy="800" r="300" fill="#06b6d4" opacity="0.03" filter="url(#blur2)"/>
  <circle cx="200" cy="900" r="200" fill="#10b981" opacity="0.04" filter="url(#blur2)"/>
  <circle cx="1700" cy="900" r="150" fill="#0ea5e9" opacity="0.03" filter="url(#blur2)"/>
  
  <!-- Subtle cross/plus shapes suggesting healthcare -->
  <g opacity="0.03" filter="url(#blur1)">
    <rect x="150" y="120" width="120" height="30" rx="15" fill="#0ea5e9"/>
    <rect x="195" y="75" width="30" height="120" rx="15" fill="#0ea5e9"/>
  </g>
  <g opacity="0.025" filter="url(#blur1)">
    <rect x="1650" y="750" width="100" height="25" rx="12" fill="#22c55e"/>
    <rect x="1687" y="712" width="25" height="100" rx="12" fill="#22c55e"/>
  </g>
  
  <!-- Abstract plant/leaf shapes suggesting healing -->
  <g opacity="0.035" filter="url(#blur1)">
    <ellipse cx="1400" cy="150" rx="60" ry="120" fill="#22c55e" transform="rotate(-20 1400 150)"/>
    <ellipse cx="1450" cy="180" rx="50" ry="100" fill="#10b981" transform="rotate(15 1450 180)"/>
  </g>
  <g opacity="0.03" filter="url(#blur1)">
    <ellipse cx="500" cy="850" rx="50" ry="100" fill="#06b6d4" transform="rotate(-30 500 850)"/>
    <ellipse cx="540" cy="870" rx="40" ry="80" fill="#0ea5e9" transform="rotate(10 540 870)"/>
  </g>
  
  <!-- Soft window/light rectangles suggesting modern clinic -->
  <rect x="100" y="400" width="300" height="400" rx="20" fill="white" opacity="0.15" filter="url(#blur2)"/>
  <rect x="1520" y="200" width="350" height="500" rx="20" fill="white" opacity="0.12" filter="url(#blur2)"/>
  
  <!-- Subtle grid pattern suggesting structured clinical data -->
  <g opacity="0.015">
    <line x1="0" y1="360" x2="1920" y2="360" stroke="#0ea5e9" stroke-width="1"/>
    <line x1="0" y1="720" x2="1920" y2="720" stroke="#0ea5e9" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="1080" stroke="#0ea5e9" stroke-width="1"/>
    <line x1="1280" y1="0" x2="1280" y2="1080" stroke="#0ea5e9" stroke-width="1"/>
  </g>
</svg>